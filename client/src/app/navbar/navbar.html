<mat-toolbar class="navbar-cm">
  <span routerLink="/" style="cursor: pointer">My Application</span>
  <div>
    <button mat-button routerLink="/">Home</button>
    <button mat-button routerLink="/missions">Missions</button>
    @if (display_name()) {
      <button mat-button routerLink="/mission-manager" routerLinkActive="active">
        My Missions
      </button>
    }
    @if (!display_name()) {
      <button mat-button routerLink="/login">Login</button>
    } @else {
      @if (avatar_url() && avatar_url() !== '/assets/default.avatar.jpg') {
        <img [src]="avatar_url()" class="user-avatar" [matMenuTriggerFor]="menu" />
      } @else {
        <div class="avatar-placeholder" [matMenuTriggerFor]="menu">
          <span>{{ display_name()?.charAt(0)?.toUpperCase() }}</span>
        </div>
      }
      <button mat-button [matMenuTriggerFor]="menu">{{ display_name() }}</button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item routerLink="/profile">Profile</button>
        <button mat-menu-item (click)="logout()">Logout</button>
      </mat-menu>
    }
  </div>
</mat-toolbar>
