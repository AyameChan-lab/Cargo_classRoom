<h4 mat-dialog-title>New Mission</h4>

<mat-dialog-content>
  <div
    style="display: flex; flex-direction: column; gap: 1rem; min-width: 300px; padding-top: 1rem"
  >
    <mat-form-field appearance="outline">
      <mat-label>Mission Name</mat-label>
      <input matInput type="text" [(ngModel)]="addMission.name" placeholder="Mission Name" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Mission Description</mat-label>
      <textarea
        matInput
        [(ngModel)]="addMission.description"
        placeholder="Mission Description"
        rows="4"
      ></textarea>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button (click)="onSubmit()" mat-stroked-button type="submit" [disabled]="!addMission.name">
    Create
  </button>
</mat-dialog-actions>
